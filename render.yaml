services:
  - type: web
    name: cfes-office-monitors
    runtime: node
    region: virginia
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: DASH_KEY
        generateValue: true
      - key: MOBILE_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ZOHO_CRM_ORG_URL
        sync: false
      - key: ZOHO_PROJECTS_URL
        sync: false
      - key: ZOHO_PORTAL_ID
        value: "727368074"
      - key: REFRESH_TIMES
        value: "06:00,06:30,07:00,07:30,08:00,08:30,09:00,09:30,10:00,10:30,11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:30,18:00,18:30,19:00"
      - key: POLL_SECONDS
        value: "300"
